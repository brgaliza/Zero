services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${ZERO_POSTGRES_USER:?ZERO_POSTGRES_USER não definido}
      POSTGRES_PASSWORD: ${ZERO_POSTGRES_PASSWORD:?ZERO_POSTGRES_PASSWORD não definido}
      POSTGRES_DB: ${ZERO_POSTGRES_DATABASE:?ZERO_POSTGRES_DATABASE não definido}
    ports:
      - "127.0.0.1:${ZERO_POSTGRES_PORT:?ZERO_POSTGRES_PORT não definido}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-bookworm
    profiles: ["complete"]
    environment:
      ZERO_REDIS_PASSWORD: ${ZERO_REDIS_PASSWORD:?ZERO_REDIS_PASSWORD não definido}
    command:
      ["redis-server", "--requirepass", "${ZERO_REDIS_PASSWORD:?ZERO_REDIS_PASSWORD não definido}"]
    ports:
      - "127.0.0.1:${ZERO_REDIS_PORT:?ZERO_REDIS_PORT não definido}:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$ZERO_REDIS_PASSWORD" ping | grep PONG']
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["complete"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ZERO_MINIO_ROOT_USER:?ZERO_MINIO_ROOT_USER não definido}
      MINIO_ROOT_PASSWORD: ${ZERO_MINIO_ROOT_PASSWORD:?ZERO_MINIO_ROOT_PASSWORD não definido}
    ports:
      - "127.0.0.1:${ZERO_MINIO_API_PORT:?ZERO_MINIO_API_PORT não definido}:9000"
      - "127.0.0.1:${ZERO_MINIO_CONSOLE_PORT:?ZERO_MINIO_CONSOLE_PORT não definido}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - storage-data:/data

  storage-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    profiles: ["complete"]
    depends_on:
      storage:
        condition: service_healthy
    command: ["mb", "--ignore-existing", "local/${ZERO_STORAGE_BUCKET:?ZERO_STORAGE_BUCKET não definido}"]
    environment:
      MC_HOST_local: http://${ZERO_MINIO_ROOT_USER:?ZERO_MINIO_ROOT_USER não definido}:${ZERO_MINIO_ROOT_PASSWORD:?ZERO_MINIO_ROOT_PASSWORD não definido}@storage:9000

  email:
    image: axllent/mailpit:v1.24.1
    profiles: ["complete"]
    ports:
      - "127.0.0.1:${ZERO_MAILPIT_SMTP_PORT:?ZERO_MAILPIT_SMTP_PORT não definido}:1025"
      - "127.0.0.1:${ZERO_MAILPIT_WEB_PORT:?ZERO_MAILPIT_WEB_PORT não definido}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  storage-data:
