name: Zero CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d5aeb5c1eb98e3a7d6cd45c75a8
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d5aeb5c1eb98e3a7d6cd45c75a8
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: RUN_DOCKER_E2E=1 npx vitest run packages/cli/test/e2e.integration.test.ts -t essential
      - run: RUN_DOCKER_E2E=1 npx vitest run packages/cli/test/e2e.integration.test.ts -t complete

  release-gate:
    if: always()
    needs: [quality, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Require quality and Docker
        run: test '${{ needs.quality.result }}' = success && test '${{ needs.docker.result }}' = success
