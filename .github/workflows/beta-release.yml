name: beta-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    environment: beta-release
    env:
      ZERO_DMG_URL: ${{ vars.ZERO_DMG_URL }}
      ZERO_DMG_SHA256: ${{ vars.ZERO_DMG_SHA256 }}
      ZERO_TEAM_ID: ${{ vars.ZERO_TEAM_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:assets -- "${GITHUB_REF_NAME}" dist/release
      - run: |
          dmg="Zero-Beta-Installer-${GITHUB_REF_NAME}.dmg"
          curl --fail --location --proto '=https' --tlsv1.2 --output "dist/release/${dmg}" "${ZERO_DMG_URL:?Configure ZERO_DMG_URL no Environment}"
          printf '%s  %s\n' "${ZERO_DMG_SHA256:?Configure ZERO_DMG_SHA256 no Environment}" "${dmg}" >> dist/release/SHA256SUMS
      - run: >-
          npm run generate:beta-guide -- --version "${GITHUB_REF_NAME}"
          --dmg-url "${ZERO_DMG_URL:?Configure ZERO_DMG_URL no Environment}"
          --dmg-sha256 "${ZERO_DMG_SHA256:?Configure ZERO_DMG_SHA256 no Environment}"
          --team-id "${ZERO_TEAM_ID:?Configure ZERO_TEAM_ID no Environment}"
          --output dist/release/GUIA-BETA-pt-BR.md
      - run: npm run verify:beta-release -- "${GITHUB_REF_NAME}" dist/release "${ZERO_TEAM_ID}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-release-${{ github.ref_name }}
          path: dist/release
